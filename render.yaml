services:
  - type: web
    name: hirelens-api
    runtime: docker
    # Both paths are relative to the repository root, and both matter.
    #
    # The Dockerfile lives in backend/, and it does `COPY requirements.txt .`
    # — a path relative to the BUILD CONTEXT, not to the Dockerfile. Pointing
    # the context at the repository root makes that COPY fail, because
    # requirements.txt is not there. This previously read `./Dockerfile` with
    # a root context, which cannot build: there is no Dockerfile at the root.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    #
    # DURABILITY — read before launching.
    #
    # The local SQLite fallback (accounts + reports when Supabase is
    # unconfigured) writes to /app/data. Render's container filesystem is
    # ephemeral, so on this plan that file is lost whenever the container is
    # replaced — which on the free plan happens on every deploy AND every
    # wake from idle sleep.
    #
    # Pick one before taking real users:
    #
    #   A. Configure Supabase (SUPABASE_URL + SUPABASE_SERVICE_KEY below).
    #      This is the right answer: it is the primary store, it survives
    #      instance replacement, and it is the only option that works with
    #      more than one instance.
    #
    #   B. Move to a paid plan and attach a disk, by changing `plan: free`
    #      to `plan: starter` and uncommenting the block below. Persistent
    #      disks are NOT available on the free plan — adding this block
    #      while `plan: free` is set makes the deploy fail. A disk is also
    #      bound to a single instance, so this does not scale horizontally.
    #
    # disk:
    #   name: hirelens-data
    #   mountPath: /app/data
    #   sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      # Generated once, when Render first creates the service. Keep it —
      # every session token is signed with it, so replacing this value signs
      # every logged-in user out. If the service is ever deleted and
      # recreated, a new value is generated and existing sessions die with
      # the old one; that is expected, not a bug in the app.
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: "10"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: ANALYSIS_TIMEOUT_SECONDS
        value: "120"
      # Optional. Raises the GitHub verification rate limit from 60/hr per
      # server IP to 5000/hr. A fine-grained token with read-only access to
      # public repositories and no account permissions is sufficient; a
      # classic token with no scopes selected works too.
      - key: GITHUB_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Must stay at 1 unless REDIS_URL is set — see the Dockerfile CMD
      # comment and job_store.py for why.
      - key: WEB_CONCURRENCY
        value: "1"
      # The service's own public URL, e.g. https://hirelens-api.onrender.com.
      # Without it the keep-alive self-ping does not start and the free
      # instance sleeps after ~15 minutes idle — the first request afterwards
      # then takes 30-60s while the container wakes, which reads as the
      # server being down.
      - key: BACKEND_URL
        sync: false
