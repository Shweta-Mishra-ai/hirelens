name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# A private repository spends Actions minutes from a monthly allowance, and
# pushing three times in five minutes otherwise leaves three full runs racing
# each other. Only the newest run for a branch is worth paying for; the older
# ones are already out of date by the time they finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt
            backend/requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          APP_ENV: development
          SECRET_KEY: test-secret-key-for-ci-only-do-not-use-in-prod
          ALLOWED_ORIGINS: "http://localhost:3000"

  backend-security:
    name: Backend — dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies for known CVEs
        run: pip-audit -r constraints.txt --desc || true
        # `|| true` — surfaces findings in the log without hard-failing CI on
        # every transitive advisory; tighten this once the project has a
        # process for triaging/patching flagged dependencies.

  backend-postgrest:
    name: Backend — real Postgres + PostgREST
    # The Supabase-path tests against the real servers rather than the fake:
    # every migration applied (twice), then the app's own client end to end.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt

      - name: Run against Postgres 16 + PostgREST
        env:
          E2E_PYTHON: python
        run: ./scripts/postgrest_e2e.sh

  backend-docker:
    name: Backend — production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t hirelens-api:ci backend

      - name: Boot in production mode and pass the healthcheck
        run: |
          docker run -d --name api -p 10000:10000 -e APP_ENV=production -e PORT=10000 \
            -e SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" \
            -e ALLOWED_ORIGINS=https://example.com hirelens-api:ci
          for i in $(seq 1 30); do curl -sf localhost:10000/api/v1/health && break; sleep 1; done
          curl -sf localhost:10000/api/v1/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:10000/docs)" = "404"
          docker logs api

  frontend-build:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      # `next lint` was removed in Next.js 16; this is the ESLint CLI with
      # Next's rule set (eslint.config.mjs). Any warning fails the job.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build the static export
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_API_URL: http://localhost:8000

      # The frontend ships as plain files. A page that silently stopped being
      # exported (a server-only API slipped in) would 404 only in production.
      - name: Static export produced every page
        run: |
          for f in index.html 404.html _headers login/index.html signup/index.html \
                   dashboard/index.html report/index.html analyze/index.html \
                   bulk/index.html match/index.html teams/index.html \
                   reset-password/index.html privacy/index.html terms/index.html \
                   account/index.html admin/index.html; do
            test -f "out/$f" || { echo "::error::missing out/$f"; exit 1; }
          done
          grep -q 'http-equiv="Content-Security-Policy"' out/index.html \
            || { echo "::error::Content-Security-Policy meta tag missing"; exit 1; }
