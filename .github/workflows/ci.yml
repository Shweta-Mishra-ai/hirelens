name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          APP_ENV: development
          SECRET_KEY: test-secret-key-for-ci-only-do-not-use-in-prod
          ALLOWED_ORIGINS: "http://localhost:3000"

  backend-security:
    name: Backend — dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies for known CVEs
        run: pip-audit -r requirements.txt --desc || true
        # `|| true` — surfaces findings in the log without hard-failing CI on
        # every transitive advisory; tighten this once the project has a
        # process for triaging/patching flagged dependencies.

  frontend-tests:
    name: Frontend — unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # `npm ci` (not `npm install`): install exactly what the lockfile
        # pins, so CI tests and audits the same dependency tree that was
        # verified locally instead of silently resolving newer versions.
        run: npm ci

      # This step didn't exist before — the frontend test suite
      # (src/__tests__, added alongside the shared UI kit) was never
      # actually run in CI, only typecheck+build were. A test suite that
      # nothing runs on every PR isn't much different from no test suite.
      - name: Run tests
        run: npm test

  frontend-security:
    name: Frontend — dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # `npm ci` (not `npm install`): install exactly what the lockfile
        # pins, so CI tests and audits the same dependency tree that was
        # verified locally instead of silently resolving newer versions.
        run: npm ci

      - name: Audit dependencies for known CVEs
        run: npm audit --audit-level=high || true
        # `|| true` for the same reason as the backend's pip-audit step —
        # surface findings without hard-failing on every transitive
        # advisory until there's a triage process for them.

  frontend-build:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # `npm ci` (not `npm install`): install exactly what the lockfile
        # pins, so CI tests and audits the same dependency tree that was
        # verified locally instead of silently resolving newer versions.
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Next.js 16 removed BOTH the `next lint` command and the ESLint pass
      # that `next build` used to run. The old step here was labelled "lint
      # runs as part of next build" and `package.json` still ran `next lint`
      # — after the 14 -> 16 upgrade neither was true, so ESLint silently
      # stopped running anywhere in CI and `npm run lint` errored out with
      # "Invalid project directory provided, no such directory: .../lint".
      # Call eslint directly so the linter is actually enforced again.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_API_URL: http://localhost:8000
