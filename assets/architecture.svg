<svg width="1100" height="420" viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1100" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12141A"/>
      <stop offset="1" stop-color="#0E0F13"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B7D78"/>
    </marker>
  </defs>
  <rect width="1100" height="420" fill="url(#abg)" rx="18"/>

  <!-- Frontend -->
  <g>
    <rect x="40" y="150" width="200" height="120" rx="16" fill="#191B22" stroke="#2A2D37"/>
    <text x="140" y="200" text-anchor="middle" fill="#EDEDEA" font-size="17" font-weight="700">Next.js 14</text>
    <text x="140" y="222" text-anchor="middle" fill="#B4B4AC" font-size="12.5">Frontend (Vercel)</text>
    <text x="140" y="242" text-anchor="middle" fill="#8A8B82" font-size="11.5">Dashboard · Analyze · Reports</text>
  </g>

  <line x1="240" y1="210" x2="330" y2="210" stroke="#3B7D78" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Backend -->
  <g>
    <rect x="335" y="120" width="230" height="180" rx="16" fill="#191B22" stroke="#2A2D37"/>
    <text x="450" y="160" text-anchor="middle" fill="#EDEDEA" font-size="17" font-weight="700">FastAPI</text>
    <text x="450" y="182" text-anchor="middle" fill="#B4B4AC" font-size="12.5">Backend (Render)</text>
    <text x="450" y="210" text-anchor="middle" fill="#8A8B82" font-size="11.5">Auth · Analysis · Verify</text>
    <text x="450" y="228" text-anchor="middle" fill="#8A8B82" font-size="11.5">Reports · Bulk · Match</text>
    <text x="450" y="246" text-anchor="middle" fill="#8A8B82" font-size="11.5">Teams · Health</text>
    <text x="450" y="272" text-anchor="middle" fill="#B98A3E" font-size="11" font-weight="600">1 worker — in-memory job store</text>
  </g>

  <!-- LLM stack -->
  <line x1="565" y1="160" x2="660" y2="90" stroke="#3B7D78" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="665" y="40" width="220" height="110" rx="16" fill="#191B22" stroke="#2A2D37"/>
    <text x="775" y="70" text-anchor="middle" fill="#EDEDEA" font-size="15" font-weight="700">LLM Fallback Chain</text>
    <text x="775" y="95" text-anchor="middle" fill="#B4B4AC" font-size="12">Gemini 2.5 Flash</text>
    <text x="775" y="114" text-anchor="middle" fill="#B4B4AC" font-size="12">→ Groq gpt-oss-120b</text>
    <text x="775" y="133" text-anchor="middle" fill="#B4B4AC" font-size="12">→ Claude Sonnet</text>
  </g>

  <!-- Supabase -->
  <line x1="565" y1="200" x2="660" y2="200" stroke="#5C9A6C" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="665" y="165" width="220" height="90" rx="16" fill="#191B22" stroke="#2A2D37"/>
    <text x="775" y="195" text-anchor="middle" fill="#EDEDEA" font-size="15" font-weight="700">Supabase</text>
    <text x="775" y="216" text-anchor="middle" fill="#B4B4AC" font-size="12">Postgres + Auth</text>
    <text x="775" y="235" text-anchor="middle" fill="#5C9A6C" font-size="11" font-weight="600">durable — primary store</text>
  </g>

  <!-- Redis -->
  <line x1="565" y1="240" x2="660" y2="310" stroke="#B98A3E" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="665" y="280" width="220" height="90" rx="16" fill="#191B22" stroke="#2A2D37"/>
    <text x="775" y="310" text-anchor="middle" fill="#EDEDEA" font-size="15" font-weight="700">Upstash Redis</text>
    <text x="775" y="331" text-anchor="middle" fill="#B4B4AC" font-size="12">Rate limits · Cache</text>
    <text x="775" y="350" text-anchor="middle" fill="#B4B4AC" font-size="12">Batch/job state</text>
  </g>

  <!-- External verification -->
  <line x1="565" y1="260" x2="450" y2="330" stroke="#5B84A6" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="335" y="335" width="230" height="60" rx="14" fill="#191B22" stroke="#2A2D37"/>
    <text x="450" y="360" text-anchor="middle" fill="#EDEDEA" font-size="13.5" font-weight="700">Public Verification</text>
    <text x="450" y="380" text-anchor="middle" fill="#B4B4AC" font-size="11.5">GitHub API · Edu/cert/company domains</text>
  </g>

  <text x="920" y="405" fill="#475569" font-size="11" text-anchor="end">Fallback stores (local SQLite / in-memory) exist only for zero-config local dev.</text>
</svg>
